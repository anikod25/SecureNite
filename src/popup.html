<!DOCTYPE html>
<html>
  <head>
    <title>SecureNite</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="header">
      <img src="icons/logo.png" width="20" height="20" alt="logo">
      <span>SecureNite</span>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Enter your password">
        <button id="toggleBtn">
          <img id="eyeIcon" src="icons/eye-open.png" width="14" height="14">
        </button>
      </div>
    </div>

    <div class="field">
      <label>Website</label>
      <input type="text" id="siteName" placeholder="Enter site name">
    </div>

    <button id="generateBtn">Encrypt</button>

    <div class="output-wrap">
      <p id="output"></p>
      <button id="copyBtn">Copy</button>
    </div>

    <script src="cipher.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
